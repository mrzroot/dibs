name: 🐛 Bug report
description: Something crashes or behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! English or Persian are both fine. / گزارش به فارسی هم پذیرفته است.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Cursor
        - Copilot / MCP
        - aider / dibs run
        - git pre-commit
        - restore / blame / log
        - watch
        - doctor
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact command and the full output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "output of `dibs --version`"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Agent + version and OS (e.g. Claude Code 2.1.295 on Ubuntu 24.04)"
